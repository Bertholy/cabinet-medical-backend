# MODÈLE des réglages privés. Copier ce fichier en « application.properties » (même dossier) puis remplir les valeurs.
# Le fichier « application.properties » de ce dossier est ignoré par Git : aucun secret ne doit être écrit ailleurs.
# Sur un serveur, on peut aussi définir ces noms comme variables d'environnement.

# --- Base de données ---
CASAFAMI_DB_PASSWORD=mot-de-passe-de-postgresql

# --- Clé de signature des connexions (obligatoire, au moins 256 bits en Base64) ---
# Générer : openssl rand -base64 48
CASAFAMI_JWT_SECRET=

# --- E-mails (mot de passe oublié) : facultatif. Sans ces lignes, le lien est seulement écrit dans les journaux
# et le super administrateur est prévenu par notification. Exemple Gmail : activer la validation en 2 étapes,
# créer un « mot de passe d'application » et le coller ci-dessous.
# CASAFAMI_MAIL_HOST=smtp.gmail.com
# CASAFAMI_MAIL_PORT=587
# CASAFAMI_MAIL_USER=cabinet@gmail.com
# CASAFAMI_MAIL_PASSWORD=mot-de-passe-d-application
# CASAFAMI_MAIL_FROM=cabinet@gmail.com

# --- SMS Twilio (à activer juste avant la soutenance) ---
# CASAFAMI_SMS_MODE=twilio
# TWILIO_ACCOUNT_SID=
# TWILIO_AUTH_TOKEN=
# TWILIO_FROM=
