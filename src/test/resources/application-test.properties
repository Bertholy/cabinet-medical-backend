# Base dédiée aux tests : ne jamais pointer vers la base réelle « casafami ».
# Créer une fois : CREATE DATABASE casafami_test ENCODING 'UTF8';
spring.datasource.url=${CASAFAMI_TEST_DB_URL:jdbc:postgresql://localhost:5432/casafami_test}
spring.datasource.username=${CASAFAMI_DB_USER:postgres}
spring.datasource.password=${CASAFAMI_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
app.upload-dir=target/test-uploads
app.rappels.actifs=false
