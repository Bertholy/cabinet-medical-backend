spring.application.name=cabinet

# Réglages privés (mot de passe de la base, clé de connexion…) : le fichier config/application.properties n'est pas publié sur Git.
# On le cherche quel que soit le dossier d'où le serveur est lancé (backend/cabinet, la racine du projet ou « backend »).
spring.config.import=optional:file:./config/application.properties,optional:file:./backend/cabinet/config/application.properties,optional:file:./cabinet/config/application.properties
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# ========== POSTGRESQL =========+=
# Les valeurs peuvent être surchargées par variables d'environnement (CASAFAMI_DB_URL, CASAFAMI_DB_USER, CASAFAMI_DB_PASSWORD)
# afin de ne plus avoir à modifier ce fichier — ni à le publier — avec des mots de passe réels.
spring.datasource.url=${CASAFAMI_DB_URL:jdbc:postgresql://localhost:5432/casafami}
spring.datasource.username=${CASAFAMI_DB_USER:postgres}
spring.datasource.password=${CASAFAMI_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ========== SERVEUR ==========
server.port=${PORT:8080}

# ========== JWT ==========
# OBLIGATOIRE : CASAFAMI_JWT_SECRET (clé Base64 d'au moins 256 bits), à écrire dans config/application.properties (voir config/application.example.properties). Aucune valeur par défaut : le serveur refuse de démarrer sans elle.
jwt.secret=${CASAFAMI_JWT_SECRET:}
jwt.expiration=86400000

# ========== SMS ==========
# simulation = les SMS sont seulement écrits dans les journaux (aucun envoi, aucun coût).
# twilio = envoi réel : renseigner les 3 variables ci-dessous (compte Twilio, essai gratuit 30 jours) puis redémarrer.
sms.mode=${CASAFAMI_SMS_MODE:simulation}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from=${TWILIO_FROM:}

# ========== PHOTOS DES SERVICES ET DES PROFILS ==========
app.upload-dir=${CASAFAMI_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# ========== RAPPELS DE RENDEZ-VOUS (la veille à 18h, heure de Madagascar) ==========
app.rappels.actifs=true

# ========== RÉSERVATION EN LIGNE ==========
# Un même nom ne peut pas faire deux réservations à moins de N jours d'intervalle (0 = aucune limite). Le personnel n'est pas concerné.
app.reservation.delai-jours=${CASAFAMI_DELAI_RESERVATION_JOURS:7}

# ========== CORS ==========
# Adresses du site autorisées à appeler l'API (séparées par des virgules). En production : l'adresse publique du site.
app.cors.origins=${CASAFAMI_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ========== NOTIFICATION DU MÉDECIN ==========
# Numéro qui reçoit un SMS à chaque nouveau rendez-vous (format local, ex. 034 12 345 67).
app.notification.numero-medecin=${CASAFAMI_NUMERO_MEDECIN:0343498888}

# ========== SAUVEGARDES (page « Sauvegardes » du super administrateur) ==========
# Automatiques : dès que la dernière a plus de 24 h (vérifié toutes les 30 minutes), les 14 dernières sont conservées.
# Dossier : par défaut « backups » à la racine du projet (trouvé quel que soit le dossier de lancement) ; en production, un disque ou dossier synchronisé hors du serveur.
app.backup.actif=${CASAFAMI_BACKUP_AUTO:true}
app.backup.dossier=${CASAFAMI_BACKUP_DIR:}
app.backup.garder=${CASAFAMI_BACKUP_KEEP:14}
app.backup.pg-dump=${CASAFAMI_PG_DUMP:}

# ========== E-MAILS (mot de passe oublié) ==========
# Facultatif : sans CASAFAMI_MAIL_HOST, aucun e-mail n'est envoyé (le lien est écrit dans les journaux du serveur et le super
# administrateur est notifié). Exemple Gmail : smtp.gmail.com, port 587, avec un « mot de passe d'application ».
spring.mail.host=${CASAFAMI_MAIL_HOST:}
spring.mail.port=${CASAFAMI_MAIL_PORT:587}
spring.mail.username=${CASAFAMI_MAIL_USER:}
spring.mail.password=${CASAFAMI_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${CASAFAMI_MAIL_FROM:}
# Adresse publique du site (pour construire le lien envoyé par e-mail).
app.frontend-url=${CASAFAMI_FRONTEND_URL:http://localhost:5173}
